[package]
name = "cargo-sycamore"
version = "0.1.0"
edition = "2024"
description = "Command-line tools for building Sycamore applications"

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
fs2 = "0.4"
notify = "8"
scraper = { version = "0.29", default-features = false }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.9"

[dev-dependencies]
serde_json = "1"
