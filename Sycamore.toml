# Optional project configuration for cargo-sycamore.
# CLI flags override matching values here. Paths are relative to this file.
[build]
# "spa" (default) generates index.html; "ssr" leaves HTML to your server app
# and requires [build.server]. Both modes build the WASM client assets.
mode = "spa"
# Shared by client/server Cargo builds:
# manifest-path = "Cargo.toml"
# Build root (default dist); files are staged under <out-dir>/.staging/ and
# published as <out-dir>/public/ plus <out-dir>/sycamore-assets.json after all
# configured builds succeed. Successful publication clears all other entries in
# this directory, so use a dedicated output directory; manual files are not kept.
# Never a location for the native backend executable.
# out-dir = "dist"
# URL deployment prefix (not a filesystem subdirectory); defaults to "/".
# public-url = "/my-app/"

# Copy files/directories into staged public/ and publish under <out-dir>/public/
# (paths relative to this file). Asset destinations (`to`) are relative to
# public/, not the build root.
# assets = [
#     "favicon.ico",
#     "images",
#     { from = "logo.svg", to = "img/brand.svg" },
#     { from = "public", to = "." }, # copies source contents to <out-dir>/public/
# ]

# Optional client build target. Fields: package, bin, example, features,
# default-features. CLI --package/--bin/--example selectors override config.
# [build.client]
# package = "web"
# bin = "client" # or example = "counter", but not both
# features = ["hydrate"]
# default-features = true

# Optional native host server executable, compiled in a separate Cargo invocation
# with its own package/bin/features. It follows the CLI --release setting.
# [build.server]
# package = "backend"
# bin = "http"
# features = ["http"]
# default-features = true
#
# At runtime the serve supervisor supplies SYCAMORE_SERVER_ADDR,
# SYCAMORE_PUBLIC_DIR=<snapshot>/public, and
# SYCAMORE_ASSET_MANIFEST=<snapshot>/sycamore-assets.json. Backend snapshots
# contain the manifest sibling to public/. The app must honor these values;
# no framework integration crate is included yet.

# `release` is deliberately CLI-only: use `cargo sycamore build --release`.
# Every successful build publishes <output_name>.bootstrap.js under
# <out-dir>/public/ and sycamore-assets.json at <out-dir> (staged under
# .staging/ first), with root-relative public URLs for
# bootstrap/js/wasm and, when enabled, stylesheet (no /public URL prefix).
# SPA generates an HTML shell; SSR leaves HTML (and any SSG/export) to the app.

[serve]
# Local development frontend port; restart serve to change it.
# May be overridden with `cargo sycamore serve --port 9000`.
port = 8080
# Browser reload after successful builds; rebuilding continues when false.
autoreload = true
# SPA fallback for missing frontend routes; CLI override: --spa / --spa=false.
# spa = false # default false; omit this in backend-only (serve-frontend=false) mode.
# Defaults to true for SPA and false for SSR. SSR cannot serve a frontend.
# serve-frontend = true
# Required by serve whenever [build.server] is configured, even when the app is
# accessed directly on another origin. Must be nonzero and differ from `port`.
# backend-port = 9000
# Forward these prefix paths to the backend before static serving/SPA fallback.
# Prefixes match path-segment boundaries; [] by default.
# forward-routes = ["/api", "/auth"]
# With serve-frontend = false, all paths except /__sycamore/ dev endpoints are
# forwarded. Explicit `spa` and nonempty `forward-routes` are rejected in backend-only mode.

[watch]
# Honor repository/nested .gitignore files during watch and serve (default true).
use-gitignore = true
# Additional gitignore-style patterns, relative to this config file.
# ignore = ["generated/", "**/*.log", "scratch/*", "!scratch/keep.rs"]

[tools.wasm-opt]
# Optimize release builds; override with --wasm-opt=false (debug builds skip it).
enable = true
# version = "133" # Pinned Binaryen release (optional override).

# Explicitly enable Tailwind for builds/watch/serve (disabled by default).
# [tools.tailwindcss]
# enable = true
# Omit input to use index.css if present, or @import "tailwindcss"; otherwise.
# input = "index.css" # Relative to this config file; explicit inputs must exist.
# output = "index.css" # Relative to <out-dir>/public/ (dist/public by default).
# version = "4.3.5" # Pinned default.
