# Optional project configuration for cargo-sycamore.
# CLI flags override matching values here. Paths are relative to this file.
[build]
# Shared with CLI flags:
# manifest-path = "Cargo.toml"
# package = "my-app"
# bin = "client"
# example = "counter" # Select an example instead of a binary/library.
# out-dir = "dist"
# Optimize release builds; override with --wasm-opt=false (debug builds skip it).
wasm-opt = true

# Config-only options:
features = []
default-features = true
# Pinned Binaryen release (optional override):
# wasm-opt-version = "133"

# `release` is deliberately CLI-only: use `cargo sycamore build --release`.

[serve]
# May be overridden with `cargo sycamore serve --port 9000`.
port = 8080
# Browser reload after successful builds; rebuilding remains enabled when false.
autoreload = true
# Serve index.html for missing routes; override with --spa or --spa=false.
spa = false

# Explicitly enable Tailwind for builds/watch/serve (disabled by default).
# [tools.tailwindcss]
# enable = true
# input = "index.css" # Default; relative to this config file.
# output = "dist/index.css" # Omit to follow the build output directory.
# version = "4.3.5" # Pinned default.
